<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Finanças Familiar</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./money-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --txt: #0f172a;
            --p: #2563eb; --s: #16a34a; --d: #dc2626; --w: #f59e0b;
            --border: #e2e8f0; --shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        [data-theme='escuro'] {
            --bg: #0f172a; --card: #1e293b; --txt: #f8fafc;
            --border: #334155; --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--txt); transition: 0.3s; padding-bottom: 80px; }
        
        /* Ecrã de Bloqueio */
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #lockScreen.hidden { display: none; }
        .btn-bio { padding: 15px 30px; font-size: 18px; background: var(--p); color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* Layout Principal */
        header { display: flex; justify-content: space-between; padding: 20px; background: var(--card); box-shadow: var(--shadow); }
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .graficos { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        /* Botões e Modais */
        .fab { position: fixed; bottom: 20px; right: 20px; background: var(--p); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: var(--shadow); border: none; z-index: 100; cursor: pointer; }
        .btn-menu { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--txt); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 20px; border-radius: 12px; z-index: 1000; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }
        .modal.active { display: block; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .overlay.active { display: block; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--txt); }
        .btn-primary { background: var(--p); color: white; border: none; font-weight: bold; }
        
        /* Zoom da Imagem */
        #imageViewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; }
        #imageViewer img { max-width: 95%; max-height: 95%; transition: transform 0.25s ease; cursor: zoom-in; }
        .fechar-zoom { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="lockScreen">
        <h2 style="margin-bottom: 20px;">Finanças Familiar</h2>
        <button class="btn-bio" onclick="autenticarBiometria()">Desbloquear (Face ID / Touch)</button>
    </div>

    <div id="appContent" style="display: none;">
        <header>
            <h2>Resumo</h2>
            <div>
                <button class="btn-menu" onclick="alternarTema()">🌓</button>
                <button class="btn-menu" onclick="abrirModal('modalExportar')">📊</button>
            </div>
        </header>

        <div id="alertasPendentes" style="padding: 10px 20px; color: var(--w); font-weight: bold; text-align: center;"></div>

        <div class="dashboard-cards">
            <div class="card"><h3>Saldo Total</h3><p id="saldoTotal">R$ 0,00</p></div>
            <div class="card"><h3>Receitas (Mês)</h3><p id="totalRec" style="color: var(--s);">R$ 0,00</p></div>
            <div class="card"><h3>Despesas (Mês)</h3><p id="totalDes" style="color: var(--d);">R$ 0,00</p></div>
        </div>

        <div class="graficos">
            <canvas id="graficoDespesas"></canvas>
        </div>

        <div style="padding: 20px;">
            <h3>Contas e Cartões <button onclick="abrirModal('modalConta')" style="width:auto; padding:5px 10px; float:right;">+</button></h3>
            <div id="listaContas"></div>
            
            <h3 style="margin-top: 20px;">Cofrinhos / Metas <button onclick="abrirModal('modalMeta')" style="width:auto; padding:5px 10px; float:right;">+</button></h3>
            <div id="listaMetas"></div>

            <h3 style="margin-top: 20px;">Transações Recentes</h3>
            <div id="listaTransacoes"></div>
        </div>

        <button class="fab" onclick="abrirModal('modalTransacao')">+</button>
    </div>

    <div class="overlay" id="overlay" onclick="fecharModais()"></div>

    <div class="modal" id="modalTransacao">
        <h3>Nova Transação</h3>
        <select id="tTipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select>
        <input type="text" id="tDescricao" placeholder="Descrição">
        <input type="number" id="tValor" step="0.01" placeholder="Valor R$">
        <input type="date" id="tData">
        <select id="tConta"><option value="">Selecione a Conta/Cartão</option></select>
        <select id="tCategoria">
            <option value="1">Alimentação (Fixa)</option>
            <option value="2">Transporte (Fixa)</option>
            <option value="3">Lazer</option>
            <option value="4">Salário</option>
        </select>
        <input type="number" id="tParcelas" min="1" value="1" placeholder="Nº de Parcelas (1 = à vista)">
        <select id="tStatus"><option value="true">Pago/Recebido</option><option value="false">Pendente</option></select>
        <input type="file" id="tFoto" accept="image/*">
        <button class="btn-primary" onclick="salvarTransacao()">Guardar</button>
    </div>

    <div class="modal" id="modalConta">
        <h3>Nova Conta / Cartão</h3>
        <input type="text" id="cNome" placeholder="Nome (ex: Nubank)">
        <select id="cTipo"><option value="corrente">Conta Corrente</option><option value="cartao">Cartão de Crédito</option></select>
        <input type="number" id="cSaldoLimite" step="0.01" placeholder="Saldo Inicial / Limite do Cartão">
        <input type="number" id="cVencimento" placeholder="Dia de Vencimento (apenas cartão)" min="1" max="31">
        <button class="btn-primary" onclick="salvarConta()">Guardar</button>
    </div>

    <div class="modal" id="modalMeta">
        <h3>Novo Cofrinho</h3>
        <input type="text" id="mNome" placeholder="Objetivo (ex: Viagem)">
        <input type="number" id="mObjetivo" step="0.01" placeholder="Valor Objetivo R$">
        <input type="number" id="mAtual" step="0.01" placeholder="Valor Já Guardado R$">
        <input type="date" id="mData">
        <button class="btn-primary" onclick="salvarMeta()">Guardar</button>
    </div>

    <div class="modal" id="modalExportar">
        <h3>Exportar Relatório</h3>
        <input type="date" id="eDataIni">
        <input type="date" id="eDataFim">
        <button class="btn-primary" onclick="baixarRelatorio()">Descarregar CSV</button>
    </div>

    <div id="imageViewer">
        <span class="fechar-zoom" onclick="fecharZoom()">×</span>
        <img id="zoomImg" src="" onclick="aplicarZoom(this)">
    </div>

    <script src="./app.js"></script>
</body>
</html>
