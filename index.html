<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Finanças Familiar</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./money-icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --txt: #0f172a;
            --p: #2563eb;
            --s: #16a34a;
            --d: #dc2626;
            --w: #f59e0b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        [data-theme='escuro'] {
            --bg: #0f172a;
            --card: #1e293b;
            --txt: #f8fafc;
            --border: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--txt);
            transition: 0.3s;
            padding-bottom: 90px;
            padding-top: env(safe-area-inset-top, 20px);
        }
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .fullscreen.hidden { display: none; }
        .btn-bio, .btn-password {
            padding: 15px 30px;
            font-size: 18px;
            background: var(--p);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            min-width: 200px;
        }
        .password-input {
            width: 80%;
            max-width: 300px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--txt);
            font-size: 16px;
            text-align: center;
        }
        .error-msg {
            color: var(--d);
            font-size: 14px;
            margin-top: 10px;
        }
        header {
            padding: 12px 16px;
            background: var(--card);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .filters {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .filter-row input, .filter-row select, .filter-row button {
            flex: 1;
            min-width: 100px;
            padding: 12px 10px;
            font-size: 16px;
        }
        .btn-menu {
            background: none;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            color: var(--txt);
            font-size: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
        }
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
        }
        .status-pending { color: var(--w); }
        .status-synced { color: var(--s); }
        .dashboard-pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
        }
        .card-top { width: 100%; max-width: 400px; text-align: center; }
        .card-bottom-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            gap: 15px;
        }
        .card-bottom-row .card { flex: 1; text-align: center; }
        .card {
            background: var(--card);
            padding: 18px 12px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        #listaContas, #listaMetas, #listaTransacoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .fab {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            right: 20px;
            background: var(--p);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: var(--shadow);
            border: none;
            z-index: 100;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .fab:active { transform: scale(0.96); }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            padding: 24px 20px;
            border-radius: 28px;
            z-index: 1000;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal.active { display: block; }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        .overlay.active { display: block; }
        input, select, button {
            width: 100%;
            padding: 14px 12px;
            margin-top: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--txt);
            font-size: 16px;
        }
        button {
            cursor: pointer;
            background: var(--p);
            color: white;
            font-weight: 600;
            border: none;
        }
        button.btn-primary { background: var(--p); }
        button.danger { background: var(--d); }
        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-actions button { flex: 1; margin-top: 0; }
        #imageViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        #imageViewer img {
            max-width: 90%;
            max-height: 85%;
            transition: transform 0.2s ease;
            cursor: zoom-in;
            border-radius: 16px;
        }
        .fechar-zoom {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.6);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            backdrop-filter: blur(4px);
        }
        #alertasPendentes {
            padding: 10px 20px;
            margin: 8px 16px;
            background: rgba(245,158,11,0.15);
            border-radius: 40px;
            color: var(--w);
            font-weight: bold;
            text-align: center;
        }
        @media (max-width: 480px) {
            .filter-row { flex-wrap: wrap; }
            .filter-row input, .filter-row select { min-width: 120px; }
            .card h3 { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div id="passwordScreen" class="fullscreen">
        <h2>🔐 Acesso Restrito</h2>
        <input type="password" id="passwordInput" class="password-input" placeholder="Senha mestra" autocomplete="off">
        <button class="btn-password" onclick="submitPassword()">Entrar</button>
        <div id="passwordError" class="error-msg"></div>
    </div>

    <div id="lockScreen" class="fullscreen hidden">
        <h2>💰 Finanças Familiar</h2>
        <button class="btn-bio" onclick="autenticarBiometria()">🔓 Desbloquear (Face ID / Touch)</button>
    </div>

    <div id="appContent" style="display: none;">
        <header>
            <div class="filters">
                <div class="filter-row">
                    <input type="month" id="monthPicker" value="">
                    <input type="date" id="dataInicioFiltro" placeholder="Data início">
                    <input type="date" id="dataFimFiltro" placeholder="Data fim">
                    <button class="btn-menu" onclick="limparFiltroData()" title="Limpar período">🗑️</button>
                </div>
                <div class="filter-row">
                    <input type="text" id="globalSearch" placeholder="🔍 Buscar...">
                    <select id="categoryFilter">
                        <option value="">📂 Todas categorias</option>
                    </select>
                    <button class="btn-menu" onclick="alternarTema()" title="Tema">🌓</button>
                    <button class="btn-menu" onclick="abrirModal('modalExportar')" title="Exportar">📊</button>
                    <button class="btn-menu" onclick="logout()" title="Sair">🚪</button>
                </div>
                <div class="filter-row">
                    <div id="syncStatus" class="sync-status" onclick="forcarSincronizacao()" title="Clique para sincronizar">🔄 Sincronizando...</div>
                </div>
            </div>
        </header>

        <div id="alertasPendentes"></div>

        <div class="dashboard-pyramid">
            <div class="card card-top">
                <h3>💰 Saldo Total</h3>
                <p id="saldoTotal" style="font-size: 2rem; font-weight: bold;">R$ 0,00</p>
            </div>
            <div class="card-bottom-row">
                <div class="card">
                    <h3>📉 Despesas (período)</h3>
                    <p id="totalDes" style="color: var(--d); font-size: 1.4rem; font-weight: bold;">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>📈 Receitas (período)</h3>
                    <p id="totalRec" style="color: var(--s); font-size: 1.4rem; font-weight: bold;">R$ 0,00</p>
                </div>
            </div>
        </div>

        <div style="padding: 0 20px 20px 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3>💳 Contas e Cartões</h3>
                <button onclick="abrirModal('modalConta')" style="width: auto; padding: 8px 16px; margin:0;">+ Adicionar</button>
            </div>
            <div id="listaContas"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0 8px;">
                <h3>🎯 Cofrinhos / Metas</h3>
                <button onclick="abrirModal('modalMeta')" style="width: auto; padding: 8px 16px; margin:0;">+ Novo</button>
            </div>
            <div id="listaMetas"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0 8px;">
                <h3>📋 Transações</h3>
            </div>
            <div id="listaTransacoes"></div>
        </div>

        <button class="fab" onclick="abrirModal('modalTransacao')">+</button>
    </div>

    <div class="overlay" id="overlay" onclick="fecharModais()"></div>

    <!-- Modal Transação -->
    <div class="modal" id="modalTransacao">
        <h3 id="tTituloModal">Nova Transação</h3>
        <input type="hidden" id="tId">
        <select id="tTipo">
            <option value="despesa">💸 Despesa</option>
            <option value="receita">💰 Receita</option>
        </select>
        <input type="text" id="tDescricao" placeholder="Descrição (opcional)">
        <input type="number" id="tValor" step="0.01" placeholder="Valor R$">
        <input type="date" id="tData">
        <select id="tConta"><option value="">Selecione a Conta/Cartão</option></select>
        <select id="tCategoria"></select>
        <input type="number" id="tParcelas" min="1" value="1" placeholder="Nº Parcelas (1 = à vista)">
        <select id="tStatus">
            <option value="true">✅ Pago / Recebido</option>
            <option value="false">⏳ Pendente</option>
        </select>
        <input type="file" id="tFoto" accept="image/*" capture="environment">
        <div class="modal-actions">
            <button id="btnExcluirTransacao" class="danger" style="display: none;" onclick="excluirItem('transacoes', 'tId')">🗑 Excluir</button>
            <button class="btn-primary" onclick="salvarTransacao()">💾 Guardar</button>
        </div>
    </div>

    <div class="modal" id="modalConta">
        <h3 id="cTituloModal">Nova Conta / Cartão</h3>
        <input type="hidden" id="cId">
        <input type="text" id="cNome" placeholder="Nome (ex: Nubank)">
        <select id="cTipo">
            <option value="corrente">🏦 Conta Corrente</option>
            <option value="cartao">💳 Cartão de Crédito</option>
        </select>
        <input type="number" id="cSaldoLimite" step="0.01" placeholder="Saldo Inicial / Limite do Cartão">
        <input type="number" id="cVencimento" placeholder="Dia de Vencimento (1-31) - Opcional" min="1" max="31">
        <div class="modal-actions">
            <button id="btnExcluirConta" class="danger" style="display: none;" onclick="excluirItem('contas', 'cId')">🗑 Excluir</button>
            <button class="btn-primary" onclick="salvarConta()">💾 Guardar</button>
        </div>
    </div>

    <div class="modal" id="modalMeta">
        <h3 id="mTituloModal">Novo Cofrinho</h3>
        <input type="hidden" id="mId">
        <input type="text" id="mNome" placeholder="Objetivo (ex: Viagem)">
        <input type="number" id="mObjetivo" step="0.01" placeholder="Valor Objetivo R$">
        <input type="number" id="mAtual" step="0.01" placeholder="Valor Já Guardado (opcional)">
        <input type="date" id="mData">
        <select id="mConta"><option value="">Conta associada (opcional)</option></select>
        <div class="modal-actions">
            <button id="btnExcluirMeta" class="danger" style="display: none;" onclick="excluirItem('metas', 'mId')">🗑 Excluir</button>
            <button class="btn-primary" onclick="salvarMeta()">💾 Guardar</button>
        </div>
    </div>

    <div class="modal" id="modalExportar">
        <h3>📎 Exportar Relatório</h3>
        <input type="date" id="eDataIni" placeholder="Data inicial">
        <input type="date" id="eDataFim" placeholder="Data final">
        <div class="modal-actions">
            <button class="btn-primary" onclick="baixarRelatorio()">📄 CSV</button>
            <button class="btn-primary" onclick="baixarPDF()">📑 PDF</button>
        </div>
    </div>

    <div id="imageViewer">
        <span class="fechar-zoom" onclick="fecharZoom()">✕</span>
        <img id="zoomImg" src="" onclick="aplicarZoom(this)">
    </div>

    <script src="./app.js"></script>
</body>
</html>
