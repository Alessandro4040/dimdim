<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Finanças Familiar</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830283.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #f8fafc; --card: #ffffff; --txt: #0f172a;
            --p: #2563eb; --s: #16a34a; --d: #dc2626;
            --border: #e2e8f0; --placeholder: #94a3b8;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --txt: #f1f5f9;
            --border: #334155; --placeholder: #64748b;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        body { background: var(--bg); color: var(--txt); padding: 16px 16px 90px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 500px; margin: 0 auto; }
        #loginScreen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .login-box { background: var(--card); padding: 32px; border-radius: 32px; width: 100%; max-width: 360px; box-shadow: var(--shadow); }
        .login-box img { width: 80px; display: block; margin: 0 auto 20px; }
        .login-box h3 { text-align: center; margin-bottom: 8px; }
        .login-box p { text-align: center; color: var(--placeholder); margin-bottom: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .periodo { display: flex; gap: 8px; align-items: center; background: var(--card); padding: 6px 12px; border-radius: 40px; border: 1px solid var(--border); }
        .periodo input[type="month"] { border: none; background: transparent; color: var(--txt); }
        .status { font-size: 12px; padding: 6px 12px; border-radius: 40px; background: var(--card); border: 1px solid var(--border); }
        .online { color: var(--s); } .offline { color: var(--d); }
        .saldo-geral { background: linear-gradient(145deg, var(--p), #1d4ed8); color: white; padding: 24px; border-radius: 32px; margin-bottom: 20px; box-shadow: 0 10px 20px -5px rgba(37,99,235,0.3); }
        .saldo-geral small { opacity: 0.9; font-size: 14px; }
        .saldo-geral h1 { font-size: 2.5rem; margin: 8px 0 16px; }
        .resumo-rapido { display: flex; justify-content: space-between; }
        .badge { background: rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 40px; }
        .contas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .conta-card { background: var(--card); border-radius: 20px; padding: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .conta-card .tipo { font-size: 12px; color: var(--placeholder); text-transform: capitalize; }
        .conta-card .saldo { font-size: 1.4rem; font-weight: bold; margin: 8px 0; }
        .conta-card .vencimento { font-size: 11px; color: var(--d); }
        .busca-filtros { display: flex; gap: 8px; margin-bottom: 20px; }
        .busca-filtros input { flex: 1; padding: 14px; border-radius: 40px; border: 1px solid var(--border); background: var(--card); color: var(--txt); }
        .busca-filtros select { padding: 0 16px; border-radius: 40px; border: 1px solid var(--border); background: var(--card); color: var(--txt); }
        .transacao-item { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
        .mini-foto { width: 50px; height: 50px; border-radius: 16px; object-fit: cover; background: var(--border); cursor: pointer; }
        .info { flex: 1; }
        .info .desc { font-weight: 600; margin-bottom: 4px; }
        .info .categoria { font-size: 12px; color: var(--placeholder); }
        .valor { font-weight: 700; font-size: 1.2rem; }
        .valor.receita { color: var(--s); } .valor.despesa { color: var(--d); }
        .fab { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; border-radius: 30px; background: var(--p); color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 20px rgba(37,99,235,0.4); border: none; cursor: pointer; z-index: 100; }
        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; backdrop-filter: blur(10px); }
        .nav-item { background: none; border: none; color: var(--placeholder); font-size: 12px; text-align: center; transition: 0.2s; cursor: pointer; }
        .nav-item.active { color: var(--p); font-weight: 600; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; background: var(--card); border-radius: 32px; padding: 24px; z-index: 1001; display: none; box-shadow: var(--shadow); }
        .modal.active { display: block; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; backdrop-filter: blur(4px); }
        .overlay.active { display: flex; align-items: center; justify-content: center; }
        input, select, textarea { width: 100%; padding: 16px; margin: 8px 0; border-radius: 24px; border: 1px solid var(--border); background: var(--card); color: var(--txt); font-size: 16px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 40px; font-weight: 600; font-size: 16px; margin-top: 12px; cursor: pointer; }
        .btn.primary { background: var(--p); color: white; }
        .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--txt); }
        #graficoContainer { background: var(--card); border-radius: 32px; padding: 20px; margin: 20px 0; border: 1px solid var(--border); }
        #zoomOverlay img { max-width: 95%; max-height: 90%; border-radius: 24px; }
        .theme-toggle { background: var(--card); border: 1px solid var(--border); border-radius: 40px; padding: 8px 16px; cursor: pointer; }
        .flex-row { display: flex; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-box">
            <img src="https://cdn-icons-png.flaticon.com/512/2830/2830283.png" alt="Logo">
            <h3>Bem‑vindo de volta</h3>
            <p>Digite sua senha mestra</p>
            <input type="password" id="inputSenha" placeholder="Senha">
            <p id="loginErro" style="color: var(--d); font-size: 14px; display: none;"></p>
            <button class="btn primary" id="btnLogin">Entrar</button>
        </div>
    </div>

    <div id="appMain" style="display: none;">
        <div class="container">
            <div class="header">
                <div class="periodo">
                    <input type="month" id="filtroMes" value="">
                </div>
                <div class="status online" id="statusLabel">🌐 Online</div>
                <div class="theme-toggle" onclick="alternarTema()">🌓</div>
            </div>

            <div id="viewResumo">
                <div class="saldo-geral">
                    <small>Saldo Total das Contas</small>
                    <h1 id="saldoTotal">R$ 0,00</h1>
                    <div class="resumo-rapido">
                        <span class="badge">📈 Mês: R$ <span id="totalRec">0,00</span></span>
                        <span class="badge">📉 Mês: R$ <span id="totalDes">0,00</span></span>
                    </div>
                </div>

                <div class="contas-grid" id="contasGrid"></div>
                <button class="btn secondary" onclick="abrirModal('modalConta')" style="margin-bottom: 20px; padding: 12px; font-size: 14px;">+ Nova Conta</button>

                <div class="busca-filtros">
                    <input type="search" id="busca" placeholder="🔍 Buscar transação...">
                    <select id="filtroConta">
                        <option value="">Todas contas</option>
                    </select>
                </div>

                <div id="listaTransacoes"></div>
                
                <button class="btn secondary" onclick="abrirModal('modalExportar')" style="margin-top: 10px;">📥 Exportar CSV</button>
            </div>

            <div id="viewGrafico" style="display: none;">
                <div id="graficoContainer">
                    <canvas id="meuGrafico"></canvas>
                </div>
                <div style="margin: 20px 0;">
                    <select id="filtroGraficoConta">
                        <option value="">Todas as contas</option>
                    </select>
                </div>
            </div>

            <div id="viewMetas" style="display: none;">
                <h3 style="margin-bottom: 16px;">🎯 Minhas metas</h3>
                <div id="metasLista"></div>
                <button class="btn primary" onclick="abrirModalMeta()">+ Nova meta</button>
            </div>
        </div>

        <button class="fab" id="fabAdd">+</button>

        <nav class="nav-bottom">
            <button class="nav-item active" data-view="resumo">🏠<br>Início</button>
            <button class="nav-item" data-view="grafico">📊<br>Gráfico</button>
            <button class="nav-item" data-view="metas">🐷<br>Metas</button>
        </nav>
    </div>

    <div class="overlay" id="overlay" onclick="fecharTodasModals()"></div>

    <div class="modal" id="modalTransacao">
        <h4 id="modalTransacaoTitle">Nova transação</h4>
        <select id="transacaoTipo">
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
        </select>
        <select id="transacaoConta"></select>
        <select id="transacaoCategoria"></select>
        <input type="date" id="transacaoData">
        <input type="text" id="transacaoDescricao" placeholder="Descrição">
        <input type="number" id="transacaoValor" step="0.01" placeholder="Valor R$">
        <label style="display: flex; align-items: center; gap: 8px; margin: 8px 0;">
            <input type="checkbox" id="transacaoPago"> <span>Já pago / recebido?</span>
        </label>
        <div id="parcelasContainer" style="display: none;">
            <input type="number" id="parcelasNum" placeholder="Nº de parcelas" min="1" value="1">
        </div>
        <button class="btn secondary" onclick="document.getElementById('fotoInput').click()">📸 Adicionar foto</button>
        <input type="file" id="fotoInput" accept="image/*" style="display: none;">
        <img id="fotoPreview" style="width: 100%; max-height: 120px; object-fit: cover; border-radius: 16px; margin: 8px 0; display: none;">
        <button class="btn primary" id="btnSalvarTransacao">Salvar Transação</button>
        <button class="btn secondary" onclick="fecharModal('modalTransacao')">Cancelar</button>
    </div>

    <div class="modal" id="modalConta">
        <h4>Nova conta / cartão</h4>
        <input type="text" id="contaNome" placeholder="Nome (ex: Nubank, Carteira)">
        <select id="contaTipo">
            <option value="banco">Banco</option>
            <option value="cartao">Cartão de crédito</option>
            <option value="dinheiro">Dinheiro físico</option>
            <option value="poupanca">Cofrinho / Poupança</option>
        </select>
        <input type="number" id="contaSaldoInicial" step="0.01" placeholder="Saldo inicial R$">
        <input type="date" id="contaVencimento" placeholder="Vencimento do cartão (Opcional)">
        <button class="btn primary" id="btnSalvarConta">Salvar conta</button>
        <button class="btn secondary" onclick="fecharModal('modalConta')">Cancelar</button>
    </div>

    <div class="modal" id="modalMeta">
        <h4>Nova meta</h4>
        <input type="text" id="metaNome" placeholder="Nome da meta">
        <input type="number" id="metaValorObjetivo" step="0.01" placeholder="Valor objetivo R$">
        <input type="date" id="metaDataLimite">
        <select id="metaConta"></select>
        <button class="btn primary" id="btnSalvarMeta">Salvar meta</button>
        <button class="btn secondary" onclick="fecharModal('modalMeta')">Cancelar</button>
    </div>

    <div class="modal" id="modalExportar">
        <h4>Exportar Relatório</h4>
        <div class="flex-row">
            <div style="flex:1"><label>Início:</label><input type="date" id="exportDataIni"></div>
            <div style="flex:1"><label>Fim:</label><input type="date" id="exportDataFim"></div>
        </div>
        <button class="btn primary" id="btnConfirmarExportar">Baixar Planilha</button>
        <button class="btn secondary" onclick="fecharModal('modalExportar')">Cancelar</button>
    </div>

    <div class="overlay" id="zoomOverlay" onclick="fecharZoom()">
        <img id="zoomedImg" src="">
    </div>

    <script src="./app.js"></script>
</body>
</html>
